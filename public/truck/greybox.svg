<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 700" width="2400" height="700">
  <g id="truck-scene">
    <g id="trailer">
      <rect x="200" y="200" width="1650" height="280" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
      <!-- Trailer chassis rail -->
      <rect x="200" y="480" width="1650" height="20" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
      
      <g id="wheel-trailer-1">
        <circle cx="300" cy="550" r="50" fill="#1E3348" stroke="#2A4A68" stroke-width="6"/>
        <line x1="300" y1="500" x2="300" y2="600" stroke="#2A4A68" stroke-width="4"/>
        <line x1="250" y1="550" x2="350" y2="550" stroke="#2A4A68" stroke-width="4"/>
      </g>
      
      <g id="wheel-trailer-2">
        <circle cx="420" cy="550" r="50" fill="#1E3348" stroke="#2A4A68" stroke-width="6"/>
        <line x1="420" y1="500" x2="420" y2="600" stroke="#2A4A68" stroke-width="4"/>
        <line x1="370" y1="550" x2="470" y2="550" stroke="#2A4A68" stroke-width="4"/>
      </g>
    </g>

    <g id="tractor">
      <g id="chassis">
        <rect x="1700" y="480" width="600" height="20" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
        <!-- Fifth wheel hitch -->
        <rect x="1780" y="460" width="60" height="20" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
      </g>
      <!-- Sleeper Cab -->
      <rect x="1950" y="220" width="200" height="260" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
      <!-- Hood -->
      <rect x="2150" y="380" width="150" height="100" fill="#1E3348" stroke="#2A4A68" stroke-width="4"/>
      
      <g id="wheel-drive-2">
        <circle cx="1750" cy="550" r="50" fill="#1E3348" stroke="#2A4A68" stroke-width="6"/>
        <line x1="1750" y1="500" x2="1750" y2="600" stroke="#2A4A68" stroke-width="4"/>
        <line x1="1700" y1="550" x2="1800" y2="550" stroke="#2A4A68" stroke-width="4"/>
      </g>
      
      <g id="wheel-drive-1">
        <circle cx="1870" cy="550" r="50" fill="#1E3348" stroke="#2A4A68" stroke-width="6"/>
        <line x1="1870" y1="500" x2="1870" y2="600" stroke="#2A4A68" stroke-width="4"/>
        <line x1="1820" y1="550" x2="1920" y2="550" stroke="#2A4A68" stroke-width="4"/>
      </g>
      
      <g id="wheel-steer">
        <circle cx="2220" cy="550" r="50" fill="#1E3348" stroke="#2A4A68" stroke-width="6"/>
        <line x1="2220" y1="500" x2="2220" y2="600" stroke="#2A4A68" stroke-width="4"/>
        <line x1="2170" y1="550" x2="2270" y2="550" stroke="#2A4A68" stroke-width="4"/>
      </g>
    </g>
  </g>
</svg>
